_format_version: '2.1'
_transform: true

services:
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest-v1
        paths:
          - /rest/v1
        strip_path: true
    plugins:
      - name: cors
        config:
          origins:
            - '*'
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - '*'
          exposed_headers:
            - '*'
          credentials: true
          max_age: 3600

  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth-v1
        paths:
          - /auth/v1
        strip_path: true
    plugins:
      - name: cors
        config:
          origins:
            - '*'
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - '*'
          exposed_headers:
            - '*'
          credentials: true
          max_age: 3600

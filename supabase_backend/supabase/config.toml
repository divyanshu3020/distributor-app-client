# Supabase Local Configuration for Bhagwati Plastic Manufacturing App
project_id = "bhagwati-distributor-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.send-delivery-otp]
verify_jwt = true

[functions.verify-delivery-otp]
verify_jwt = true

[functions.generate-quote-pdf]
verify_jwt = true

[functions.push-notifications]
verify_jwt = true

[functions.calculate-vehicle-fare]
verify_jwt = true

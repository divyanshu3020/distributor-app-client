name: flutter_client
description: "Bhagwati Plastic Manufacturing - B2B Distributor & Operations Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase Client & Realtime
  supabase_flutter: ^2.3.4

  # State Management & Utilities
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  crypto: ^3.0.3

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Icons & UI Polish
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/vehicles/

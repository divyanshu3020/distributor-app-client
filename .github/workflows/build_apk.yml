name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI with one click

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 for Android Gradle build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Securely inject production environment variables (.env)
      - name: Create flutter_client/.env from GitHub Secrets
        run: |
          mkdir -p flutter_client
          cat << 'EOF' > flutter_client/.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          APP_ENV=production
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }}
          EOF

      # 5. Get Flutter dependencies
      - name: Install Dependencies
        working-directory: flutter_client
        run: flutter pub get

      # 6. Build Release APK
      - name: Build Release APK
        working-directory: flutter_client
        run: flutter build apk --release

      # 7. Upload the compiled APK as a downloadable GitHub Action Artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhagwati-plastics-release-apk
          path: flutter_client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

name: Build Android APK & Deploy iOS PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------
  # JOB 1: Build Android APK
  # ---------------------------------------------
  build-apk:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create flutter_client/.env from GitHub Secrets
        run: |
          mkdir -p flutter_client
          cat << 'EOF' > flutter_client/.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          APP_ENV=production
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }}
          EOF

      - name: Install Dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_client
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhagwati-plastics-release-apk
          path: flutter_client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ---------------------------------------------
  # JOB 2: Build & Deploy iOS PWA (GitHub Pages)
  # ---------------------------------------------
  deploy-pwa:
    name: Build & Deploy iOS PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create flutter_client/.env from GitHub Secrets
        run: |
          mkdir -p flutter_client
          cat << 'EOF' > flutter_client/.env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          APP_ENV=production
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FCM_VAPID_KEY=${{ secrets.FCM_VAPID_KEY }}
          EOF

      - name: Install Dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Build Web PWA
        working-directory: flutter_client
        run: flutter build web --release --base-href "/distributor-app-client/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_client/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
